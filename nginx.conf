# ─────────────────────────────────────────────────────────────
# nginx dentro del contenedor del portfolio.
# Cadena: Cloudflare (HTTPS) → túnel → cloudflared → 127.0.0.1:8089 → aquí (:8080)
# HSTS lo pone Cloudflare (es quien sirve el HTTPS), no este nginx.
# ─────────────────────────────────────────────────────────────
server {
    listen       8080;   # nginx-unprivileged: puerto >1024, sin privilegios
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # no anunciar la versión exacta (Server: nginx/1.27.5 → nginx)
    server_tokens off;

    # IP real del visitante en los logs (Cloudflare la manda en CF-Connecting-IP).
    # Sin esto, todas las visitas parecen venir del gateway de Docker (172.x).
    # Solo se fía de la cabecera si la conexión viene de la red propia del
    # contenedor (portfolio_net en docker-compose.yml). OWASP #5: antes era
    # 172.16.0.0/12 → cualquier contenedor de cualquier red Docker podía falsear la IP.
    set_real_ip_from 172.30.89.0/24;
    real_ip_header   CF-Connecting-IP;

    # web estática: solo lectura. POST, PUT, DELETE, TRACE… → 405
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # ── Cabeceras de seguridad ──────────────────────────────
    # OJO: ninguna location puede tener add_header, o anularía TODAS estas
    # (nginx no hereda add_header si el bloque hijo define alguno).
    # "always" = también en respuestas de error (404, 405).

    # CSP: solo recursos propios. Excepciones justificadas:
    #   img-src data:   → textura SVG en data: URI de styles.css (.fx-grain)
    #   frame-src       → iframe con la demo de LinkedIn
    # Probada en Report-Only (13 nov): consola limpia → activada.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.linkedin.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    # nadie puede meter la web en un iframe (clickjacking).
    # Equivale a frame-ancestors 'none'; se mantiene para navegadores antiguos.
    add_header X-Frame-Options "DENY" always;

    # el navegador no adivina tipos: un .png es imagen aunque contenga JS
    add_header X-Content-Type-Options "nosniff" always;

    # a otros sitios solo les llega el dominio, nunca la ruta completa
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # APIs del navegador que esta web no usa → desactivadas
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;

    # aísla la pestaña: una ventana abierta desde otro sitio no puede tocar window.opener
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # otros sitios no pueden cargar mis recursos (imágenes, js…), sí www ↔ raíz
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # COEP NO: obligaría a LinkedIn a mandar CORP/CORS y rompería el iframe.
    # X-XSS-Protection NO: obsoleta; la sustituye la CSP.

    # ── Compresión ──────────────────────────────────────────
    gzip               on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_vary          on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ── Rutas ───────────────────────────────────────────────
    # Contacto para quien encuentre una vulnerabilidad (RFC 9116).
    # Expires: obligatorio y, según el RFC, a menos de 1 año vista → renovarlo.
    location = /.well-known/security.txt {
        default_type "text/plain; charset=utf-8";
        return 200 "Contact: mailto:jorgesiemprearmando@gmail.com\nExpires: 2027-11-01T00:00:00Z\nPreferred-Languages: es, en\n";
    }

    # archivos ocultos (.git, .env…) → 404, menos .well-known
    location ~ /\.(?!well-known) {
        return 404;
    }

    # extensiones sensibles → 404 (.md: assets/README.md SÍ se copia con COPY assets;
    # .map: source maps exponen el código. El resto hoy no se copian a la imagen;
    # protege si algún día cambia el Dockerfile)
    location ~* \.(env|ini|log|bak|sql|tar|gz|zip|old|swp|map|md)$ {
        return 404;
    }

    # assets: caché larga ("expires" genera Cache-Control sin ser add_header)
    location ~* \.(css|js|woff2?|ttf|ico|png|jpe?g|gif|webp|svg|avif)$ {
        expires 7d;
        try_files $uri =404;
    }

    # HTML: caché corta. Lo que no existe → 404 real (sin soft 404)
    location / {
        expires 5m;
        try_files $uri $uri/ =404;
    }
}
