# Endurecido según OWASP Docker Security Cheat Sheet → ver DOCKER_SECURITY.md
services:
  portfolio:
    build: .
    image: jae-portfolio:latest
    container_name: jae-portfolio
    # OWASP #7 sugiere on-failure:N. Se mantiene unless-stopped a propósito:
    # web pública → prioriza volver a levantarse tras reiniciar el VPS.
    restart: unless-stopped
    # Sin ports: el contenedor no publica nada en el host. Solo lo alcanza el
    # servicio cloudflared por la red interna (portfolio_internal).
    volumes:
      # access.log en el host para que siege-map (radar) lo lea.
      # Montar encima de /var/log/nginx tapa los symlinks de la imagen
      # (access.log → /dev/stdout) y nginx escribe un archivo real.
      # Rotación: logrotate del host con copytruncate (nginx está en el contenedor).
      # Único punto escribible del contenedor (aparte de /tmp) → no puede ser :ro.
      # En el host debe ser del uid 101:  sudo chown -R 101:101 /var/log/web/portfolio
      # (si no: "open() error.log failed (13: Permission denied)" y no arranca)
      - /var/log/web/portfolio:/var/log/nginx

    # ── OWASP #8: raíz de solo lectura ──────────────────────
    # Un atacante con ejecución no puede dejar webshells ni tocar la config.
    # nginx-unprivileged solo necesita /tmp (PID + client/proxy temp).
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev

    # ── OWASP #3: sin capabilities ──────────────────────────
    # uid 101 escuchando en 8080 no necesita ninguna (ni NET_BIND_SERVICE).
    cap_drop:
      - ALL

    # ── OWASP #4 / #6 ───────────────────────────────────────
    # no-new-privileges: ningún binario SUID/SGID puede subir privilegios.
    # seccomp/AppArmor: se dejan los perfiles por defecto (NO poner unconfined).
    security_opt:
      - no-new-privileges:true

    # ── OWASP #7: límites de recursos ───────────────────────
    # Que un DoS o un proceso desbocado no tumbe el resto del VPS.
    mem_limit: 128m
    memswap_limit: 128m      # = mem_limit → sin swap extra
    cpus: 0.5
    pids_limit: 100          # corta fork bombs
    ulimits:
      nofile:
        soft: 1024
        hard: 2048

    # Logs de Docker (stdout/stderr del contenedor) con tope: sin esto el
    # json-file crece sin límite y puede llenar el disco del VPS.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ── OWASP #5: red propia, interna, sin salida a Internet ─
    # Una web estática no necesita iniciar conexiones: si alguien consigue
    # ejecutar código dentro, no puede descargar herramientas ni abrir una
    # reverse shell.
    networks:
      - portfolio_internal

    healthcheck:
      # 127.0.0.1 y no localhost: localhost → ::1 y nginx solo escucha IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      project: "jae-portfolio"
      owner:   "jorge.armando.escobar"

  # ── Túnel de Cloudflare propio del portfolio ─────────────
  # Sustituye al cloudflared del host (systemd, root) para este proyecto.
  # Es el único servicio con salida: está en las dos redes.
  cloudflared:
    # OWASP #13: versión + digest
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    container_name: jae-portfolio-tunnel
    restart: unless-stopped
    # Token como Docker secret (OWASP #12), nunca en environment (TUNNEL_TOKEN).
    # Métricas solo en 127.0.0.1 del contenedor: por defecto escucha en
    # 0.0.0.0 y el portfolio podría consultarlas por la red interna.
    command: >-
      tunnel --no-autoupdate --metrics 127.0.0.1:20241
      run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    # La imagen ya corre como 65532:65532 (nonroot, distroless).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portfolio_internal   # llegar a http://portfolio:8080
      - tunnel_egress        # salir hacia Cloudflare
    healthcheck:
      # Imagen distroless (sin shell ni wget): usa el propio binario.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      portfolio:
        condition: service_healthy
    labels:
      project: "jae-portfolio"
      owner:   "jorge.armando.escobar"

networks:
  portfolio_internal:
    name: portfolio_internal
    # Sin salida a Internet. Por eso el portfolio ya no puede publicar puertos
    # (Docker no publica en redes internal) y le llega el tráfico por cloudflared.
    internal: true
    # Subred fija → nginx.conf solo se fía de CF-Connecting-IP si la conexión
    # viene de esta red (ahora: desde el contenedor cloudflared).
    # Si choca con otra red del VPS: cambiarla aquí Y en nginx.conf.
    ipam:
      config:
        - subnet: 172.30.89.0/24
  tunnel_egress:
    name: portfolio_tunnel_egress
    driver: bridge

secrets:
  tunnel_token:
    # Carpeta 700, fichero 444 (el contenedor corre como 65532 y lo tiene
    # que poder leer). secrets/ está en .gitignore y .dockerignore.
    file: ./secrets/tunnel_token
